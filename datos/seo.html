<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>SEO HORECA</title>
<style>
  :root {
    --fondo:#f7f9fb; --tarjeta:#fff; --tinta:#1f2d3d; --suave:#637389; --linea:#e3e8ef; --enlace:#1f6fd6;
    --ok-fondo:#e4f6ec; --ok-tinta:#17683e; --esp-fondo:#fff4d6; --esp-tinta:#8a5a00;
    --mal-fondo:#fde8e8; --mal-tinta:#9b1c1c; --neutro-fondo:#eef1f5; --neutro-tinta:#4a5a70; --acento:#1f6fd6; --barra:#1f6fd6; --barra2:#9cc3f5;
  }
  :root[data-theme="dark"] {
    --fondo:#151a21; --tarjeta:#1d242d; --tinta:#e6ebf1; --suave:#93a3b8; --linea:#2c3643; --enlace:#6aa8ff;
    --ok-fondo:#173a28; --ok-tinta:#7fdca6; --esp-fondo:#3d3113; --esp-tinta:#f3c96b;
    --mal-fondo:#3f1d1d; --mal-tinta:#f5a3a3; --neutro-fondo:#27303b; --neutro-tinta:#b3c0d0; --acento:#6aa8ff; --barra:#6aa8ff; --barra2:#2f4f7a;
  }
  * { box-sizing:border-box; } html, body { margin:0; }
  [hidden] { display:none !important; }
  body { background:var(--fondo); color:var(--tinta); font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; padding:14px; }
  main { display:grid; gap:12px; max-width:1040px; }
  section { background:var(--tarjeta); border:1px solid var(--linea); border-radius:8px; padding:12px 14px; }
  h1 { font-size:16px; margin:0; text-wrap:balance; }
  h2 { font-size:11px; margin:0 0 10px; color:var(--suave); text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  .sub { color:var(--suave); margin-top:2px; }
  .cabecera { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap; }
  .cifras { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; }
  .cifra { border:1px solid var(--linea); border-radius:6px; padding:9px 11px; }
  .cifra b { display:block; font-size:19px; font-variant-numeric:tabular-nums; }
  .cifra span { color:var(--suave); font-size:11px; display:block; }
  .delta { font-size:11px; font-weight:600; }
  .delta.ok { color:var(--ok-tinta); } .delta.mal { color:var(--mal-tinta); } .delta.neutro { color:var(--suave); }
  .btn { font:inherit; font-weight:600; font-size:12px; padding:6px 12px; border:1px solid var(--acento); border-radius:6px; background:var(--acento); color:#fff; cursor:pointer; }
  .btn.sec { background:transparent; color:var(--acento); }
  .chip { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--neutro-fondo); color:var(--neutro-tinta); white-space:nowrap; }
  .chip.ok { background:var(--ok-fondo); color:var(--ok-tinta); }
  .chip.esp { background:var(--esp-fondo); color:var(--esp-tinta); }
  .chip.mal { background:var(--mal-fondo); color:var(--mal-tinta); }
  .banner { border-radius:6px; padding:9px 11px; font-size:12px; }
  .banner.info { background:var(--neutro-fondo); color:var(--neutro-tinta); }
  .banner.esp { background:var(--esp-fondo); color:var(--esp-tinta); }
  .vacio, .estado { color:var(--suave); }
  .estado { padding:24px 4px; }
  footer { color:var(--suave); font-size:11px; }
  select { font:inherit; padding:6px 8px; border:1px solid var(--linea); border-radius:6px; background:var(--fondo); color:var(--tinta); }
  .dos { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; }
  @media (max-width:820px) { .dos { grid-template-columns:1fr; } }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th, td { text-align:left; padding:5px 6px; border-top:1px solid var(--linea); vertical-align:top; }
  th { color:var(--suave); font-weight:600; font-size:11px; border-top:0; }
  td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  td.u { max-width:360px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .grafica { display:flex; align-items:flex-end; gap:2px; height:90px; margin-top:6px; }
  .grafica div { flex:1; background:var(--barra2); border-radius:2px 2px 0 0; position:relative; min-width:3px; }
  .grafica div i { position:absolute; left:0; right:0; bottom:0; background:var(--barra); border-radius:2px 2px 0 0; }
  .eje { display:flex; justify-content:space-between; color:var(--suave); font-size:10px; margin-top:3px; }
  .leyenda { font-size:11px; color:var(--suave); margin-top:6px; }
  .msg { font-size:12px; margin-left:8px; }
</style>
</head>
<body>
<main id="raiz"><p class="estado">Cargando…</p></main>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var clave = params.get('k') || '';
  var dias = Number(params.get('dias')) || 28;
  try { if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark'; } catch (e) {}
  var raiz = document.getElementById('raiz');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var n = function (x, d) { return Number(x || 0).toLocaleString('es-CO', { maximumFractionDigits: d == null ? 0 : d, minimumFractionDigits: d == null ? 0 : d }); };
  var pct = function (x) { return n(100 * (x || 0), 1) + ' %'; };
  var delta = function (a, b, inverso) {
    if (!b) return '<span class="delta neutro">sin base</span>';
    var v = (a - b) / b; var s = (v > 0 ? '+' : '') + n(100 * v, 0) + ' %';
    var bien = inverso ? v < 0 : v > 0; var cls = Math.abs(v) < 0.005 ? 'neutro' : bien ? 'ok' : 'mal';
    return '<span class="delta ' + cls + '">' + s + ' vs. periodo anterior</span>';
  };
  var fecha = function (s) { return s ? new Date(s).toLocaleDateString('es-CO', { day: '2-digit', month: 'short' }) : '—'; };
  var url = function (u) { try { var x = new URL(u); return x.pathname + x.search; } catch (e) { return u; } };

  function grafica(t) {
    if (!t || !t.length) return '<p class="vacio">Sin datos diarios todavía.</p>';
    var maxI = Math.max.apply(null, t.map(function (d) { return d.impresiones; })) || 1;
    return '<div class="grafica">' + t.map(function (d) {
      var hi = Math.max(2, 100 * d.impresiones / maxI); var hc = d.impresiones ? 100 * d.clics / d.impresiones : 0;
      return '<div style="height:' + hi + '%" title="' + esc(d.fecha) + ': ' + n(d.clics) + ' clics · ' + n(d.impresiones) + ' impresiones"><i style="height:' + Math.min(100, hc * 4) + '%"></i></div>';
    }).join('') + '</div><div class="eje"><span>' + fecha(t[0].fecha) + '</span><span>' + fecha(t[t.length - 1].fecha) + '</span></div><p class="leyenda">Barras claras: impresiones por día · oscuro: proporción de clics.</p>';
  }

  function tabla(filas, col, cab) {
    if (!filas || !filas.length) return '<p class="vacio">Todavía no hay datos. Search Console empieza a mostrar información 2 a 3 días después de verificar la propiedad.</p>';
    return '<table><thead><tr><th>' + cab + '</th><th class="n">Clics</th><th class="n">Impr.</th><th class="n">CTR</th><th class="n">Pos.</th></tr></thead><tbody>' +
      filas.map(function (f) { return '<tr><td class="u" title="' + esc(f[col]) + '">' + esc(col === 'url' ? url(f[col]) : f[col]) + '</td><td class="n">' + n(f.clics) + '</td><td class="n">' + n(f.impresiones) + '</td><td class="n">' + pct(f.ctr) + '</td><td class="n">' + n(f.posicion, 1) + '</td></tr>'; }).join('') + '</tbody></table>';
  }

  function pintar(d) {
    var t = d.totales || {}, a = d.anteriores || {};
    var html = '';
    html += '<section><div class="cabecera"><div><h1>SEO · ' + esc(d.propiedad) + '</h1><p class="sub">Google Search Console · ' + esc(d.periodo.desde) + ' a ' + esc(d.periodo.hasta) + ' (' + d.periodo.dias + ' días; Google entrega los datos con 2 días de retraso)</p></div>' +
      '<div><select id="dias"><option value="7">7 días</option><option value="28">28 días</option><option value="90">90 días</option></select></div></div>';
    if (d.sinConfig) html += '<p class="banner esp" style="margin-top:10px">Falta la credencial de Search Console (GSC_CREDENCIALES) en el servidor.</p>';
    if (d.error) html += '<p class="banner esp" style="margin-top:10px">No se pudo leer Search Console: ' + esc(d.detalle || d.error) + '</p>';
    html += '</section>';
    if (!d.sinConfig && !d.error) {
      html += '<section><h2>Resultados de búsqueda</h2><div class="cifras">' +
        '<div class="cifra"><b>' + n(t.clics) + '</b><span>Clics</span>' + delta(t.clics, a.clics) + '</div>' +
        '<div class="cifra"><b>' + n(t.impresiones) + '</b><span>Impresiones</span>' + delta(t.impresiones, a.impresiones) + '</div>' +
        '<div class="cifra"><b>' + pct(t.ctr) + '</b><span>CTR</span>' + delta(t.ctr, a.ctr) + '</div>' +
        '<div class="cifra"><b>' + n(t.posicion, 1) + '</b><span>Posición media</span>' + delta(t.posicion, a.posicion, true) + '</div></div>' +
        grafica(d.tendencia) + '</section>';
      html += '<div class="dos"><section><h2>Consultas con más impresiones</h2>' + tabla(d.consultas, 'consulta', 'Consulta') + '</section>' +
        '<section><h2>Páginas con más impresiones</h2>' + tabla(d.paginas, 'url', 'Página') + '</section></div>';
      var disp = (d.dispositivos || []).map(function (x) { return '<span class="chip">' + esc({ MOBILE: 'Móvil', DESKTOP: 'Escritorio', TABLET: 'Tableta' }[x.dispositivo] || x.dispositivo) + ': ' + n(x.clics) + ' clics · ' + n(x.impresiones) + ' impr.</span>'; }).join(' ');
      var sm = (d.sitemaps || []);
      html += '<section><h2>Indexación</h2>' + (disp ? '<p>' + disp + '</p>' : '') +
        (sm.length ? '<table><thead><tr><th>Sitemap</th><th>Enviado</th><th>Leído por Google</th><th class="n">URLs</th><th class="n">Indexadas</th><th>Estado</th></tr></thead><tbody>' + sm.map(function (s) {
          return '<tr><td class="u">' + esc(url(s.url)) + '</td><td>' + fecha(s.enviado) + '</td><td>' + fecha(s.leido) + '</td><td class="n">' + n(s.urls) + '</td><td class="n">' + (s.indexadas ? n(s.indexadas) : '—') + '</td><td>' + (s.errores ? '<span class="chip mal">' + s.errores + ' errores</span>' : s.pendiente ? '<span class="chip esp">pendiente</span>' : '<span class="chip ok">ok</span>') + (s.avisos ? ' <span class="chip esp">' + s.avisos + ' avisos</span>' : '') + '</td></tr>';
        }).join('') + '</tbody></table>' : '<p class="vacio">No hay sitemap enviado.</p>') +
        '<p style="margin-top:10px"><button class="btn sec" id="btnSitemap">Enviar sitemap a Google</button><span class="msg" id="msgSitemap"></span></p></section>';
    }
    var c = d.contenido;
    html += '<section><h2>Contenido SEO publicado en la tienda</h2>' + (c ? '<div class="cifras"><div class="cifra"><b>' + n(c.productos) + '</b><span>Productos con título/meta/alt/FAQ</span></div><div class="cifra"><b>' + n(c.colecciones) + '</b><span>Colecciones con descripción/FAQ</span></div><div class="cifra"><b>' + (c.ultimo ? fecha(c.ultimo) : '—') + '</b><span>Última publicación</span></div></div>' : '<p class="vacio">Sin registro.</p>') +
      '<p class="leyenda">Datos estructurados (empresa, migas de pan, FAQ) activos en el tema. Regenerar contenido: <span class="mono">node seo/contenido.mjs</span> en el worker.</p></section>';
    html += '<footer>Cuenta de servicio de Google con acceso de solo lectura a la propiedad. Los cambios en el tema y el catálogo se hacen desde Shopify.</footer>';
    raiz.innerHTML = html;
    var sel = document.getElementById('dias'); if (sel) { sel.value = String(d.periodo.dias); sel.onchange = function () { dias = Number(sel.value); cargar(); }; }
    var b = document.getElementById('btnSitemap');
    if (b) b.onclick = function () {
      var m = document.getElementById('msgSitemap'); b.disabled = true; m.textContent = 'Enviando…';
      fetch(location.pathname + '?k=' + encodeURIComponent(clave), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accion: 'sitemap' }) })
        .then(function (r) { return r.json(); }).then(function (j) { m.textContent = j.ok ? 'Sitemap enviado.' : 'No se pudo: ' + (j.motivo || j.estado); b.disabled = false; setTimeout(cargar, 1500); })
        .catch(function () { m.textContent = 'Error de red.'; b.disabled = false; });
    };
  }

  function cargar() {
    raiz.innerHTML = '<p class="estado">Cargando…</p>';
    fetch(location.pathname + '?k=' + encodeURIComponent(clave) + '&datos=1&dias=' + dias)
      .then(function (r) { return r.json(); }).then(pintar)
      .catch(function () { raiz.innerHTML = '<p class="estado">No se pudo cargar el panel.</p>'; });
  }
  cargar();
})();
</script>
</body>
</html>
